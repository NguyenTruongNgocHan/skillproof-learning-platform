spring.application.name=skillproof-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/skillproof}
spring.datasource.username=${DB_USERNAME:skillproof}
spring.datasource.password=${DB_PASSWORD:skillproof}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties[mail.smtp.auth]=${MAIL_SMTP_AUTH:false}
spring.mail.properties[mail.smtp.starttls.enable]=${MAIL_STARTTLS:false}

spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

skillproof.identity.email-verification.ttl=30m
skillproof.identity.email-verification.resend-cooldown=60s

skillproof.identity.email-verification.frontend-verification-url=${FRONTEND_VERIFICATION_URL:http://localhost:5173/verify-email}

skillproof.identity.email-verification.from-address=${MAIL_FROM:no-reply@skillproof.local}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.jackson.default-property-inclusion=non_null