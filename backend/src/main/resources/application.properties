spring.application.name=skillproof-backend
server.port=${SERVER_PORT:8080}
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/skillproof}
spring.datasource.username=${DB_USERNAME:skillproof}
spring.datasource.password=${DB_PASSWORD:skillproof}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties[mail.smtp.auth]=${MAIL_SMTP_AUTH:true}
spring.mail.properties[mail.smtp.starttls.enable]=${MAIL_STARTTLS:true}
spring.mail.properties[mail.smtp.starttls.required]=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties[mail.smtp.ssl.enable]=${MAIL_SSL:false}

spring.mail.properties[mail.smtp.connectiontimeout]=20000
spring.mail.properties[mail.smtp.timeout]=20000
spring.mail.properties[mail.smtp.writetimeout]=20000

skillproof.identity.email-verification.ttl=30m
skillproof.identity.email-verification.resend-cooldown=60s

skillproof.identity.email-verification.frontend-verification-url=${FRONTEND_VERIFICATION_URL:http://localhost:5173/verify-email}

skillproof.identity.email-verification.from-address=${MAIL_FROM:${MAIL_USERNAME}}

skillproof.identity.password-reset.ttl=${PASSWORD_RESET_TTL:30m}
skillproof.identity.password-reset.request-cooldown=${PASSWORD_RESET_COOLDOWN:60s}
skillproof.identity.password-reset.frontend-reset-url=${FRONTEND_PASSWORD_RESET_URL:http://localhost:5173/reset-password}
skillproof.identity.password-reset.from-address=${MAIL_FROM:${MAIL_USERNAME}}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.jackson.default-property-inclusion=non_null

skillproof.identity.token.issuer=${JWT_ISSUER:skillproof}
skillproof.identity.token.secret=${JWT_SECRET:}
skillproof.identity.token.access-ttl=${ACCESS_TOKEN_TTL:15m}
skillproof.identity.token.refresh-ttl=${REFRESH_TOKEN_TTL:30d}
skillproof.identity.token.secure-cookie=${COOKIE_SECURE:false}

skillproof.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
skillproof.organization.frontend-url=${FRONTEND_URL:http://localhost:5173}
skillproof.bootstrap.admin.email=${ADMIN_EMAIL:}
skillproof.bootstrap.admin.password=${ADMIN_PASSWORD:}

# Required private S3-compatible bucket (MinIO for integration / S3 on deployment).
# No local-disk fallback. Production uses the SDK default credential chain if keys are unset.
skillproof.media.bucket=${MEDIA_S3_BUCKET}
skillproof.media.region=${MEDIA_S3_REGION}
skillproof.media.endpoint=${MEDIA_S3_ENDPOINT:}
skillproof.media.access-key=${MEDIA_S3_ACCESS_KEY:}
skillproof.media.secret-key=${MEDIA_S3_SECRET_KEY:}
skillproof.media.prefix=${MEDIA_S3_PREFIX:skillproof/}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=101MB

# Realtime challenge. Redis is ephemeral coordination only; PostgreSQL remains durable truth.
skillproof.realtime.ws-path=${REALTIME_WS_PATH:/ws/realtime}
skillproof.realtime.ws-public-url=${REALTIME_WS_PUBLIC_URL:ws://localhost:8080/ws/realtime}
skillproof.realtime.ticket-ttl=${REALTIME_TICKET_TTL:60s}
skillproof.realtime.question-count=${REALTIME_QUESTION_COUNT:5}
skillproof.realtime.question-seconds=${REALTIME_QUESTION_SECONDS:20}
skillproof.realtime.reconnect-seconds=${REALTIME_RECONNECT_SECONDS:30}
skillproof.realtime.elo-k-factor=${REALTIME_ELO_K_FACTOR:32}
