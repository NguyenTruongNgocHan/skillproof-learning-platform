# Production reads injected environment/configuration, never a local .env file.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
skillproof.identity.token.secret=${JWT_SECRET}
skillproof.identity.token.secure-cookie=true
skillproof.cors.allowed-origin=${FRONTEND_ORIGIN}
skillproof.organization.frontend-url=${FRONTEND_URL}
skillproof.identity.email-verification.frontend-verification-url=${FRONTEND_VERIFICATION_URL}
skillproof.identity.password-reset.frontend-reset-url=${FRONTEND_PASSWORD_RESET_URL}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
server.forward-headers-strategy=framework
