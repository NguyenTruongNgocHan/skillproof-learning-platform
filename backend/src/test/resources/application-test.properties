spring.datasource.url=jdbc:h2:mem:skillproof;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
skillproof.identity.token.secret=test-secret-with-at-least-thirty-two-characters
spring.jpa.open-in-view=false

spring.flyway.enabled=false

spring.data.redis.repositories.enabled=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Test must not wait 60 seconds between resends.
skillproof.identity.email-verification.resend-cooldown=0s

skillproof.identity.email-verification.ttl=30m

spring.mail.host=localhost
spring.mail.port=1025
