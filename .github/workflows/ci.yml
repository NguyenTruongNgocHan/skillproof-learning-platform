name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: skillproof
          POSTGRES_USER: skillproof
          POSTGRES_PASSWORD: skillproof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillproof -d skillproof"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: pgsty/silo:latest
        env:
          MINIO_ROOT_USER: skillproof
          MINIO_ROOT_PASSWORD: skillproof123
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw clean test

      - name: Provision private S3 test bucket
        env:
          AWS_ACCESS_KEY_ID: skillproof
          AWS_SECRET_ACCESS_KEY: skillproof123
        run: |
          aws s3api create-bucket --bucket skillproof-media --endpoint-url http://localhost:9000
          aws s3api put-bucket-acl --bucket skillproof-media --acl private --endpoint-url http://localhost:9000

      - name: Run S3-compatible integration test
        env:
          S3_IT_ENABLED: 'true'
          MEDIA_S3_BUCKET: skillproof-media
          MEDIA_S3_REGION: us-east-1
          MEDIA_S3_ENDPOINT: http://localhost:9000
          MEDIA_S3_ACCESS_KEY: skillproof
          MEDIA_S3_SECRET_KEY: skillproof123
        run: ./mvnw -Dtest=S3CompatibilityIntegrationTest test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
