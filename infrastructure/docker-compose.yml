services:
  postgres:
    image: postgres:18
    container_name: skillproof-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skillproof
      POSTGRES_USER: skillproof
      POSTGRES_PASSWORD: skillproof
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8
    container_name: skillproof-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mailpit:
    image: axllent/mailpit:v1.30.6
    container_name: skillproof-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres_data:
  redis_data: