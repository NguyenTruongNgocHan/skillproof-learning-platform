services:
  postgres:
    image: postgres:18
    container_name: skillproof-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skillproof
      POSTGRES_USER: skillproof
      POSTGRES_PASSWORD: skillproof
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillproof -d skillproof"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8
    container_name: skillproof-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: pgsty/silo:latest
    container_name: skillproof-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: skillproof
      MINIO_ROOT_PASSWORD: skillproof123
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  minio_data: